
#EPISODE TWO: Subtitles
#Networks
networks:
  bazarr-network:
    driver: bridge


# Subtitles
Services:
  opensubtitles-scraper:
    build:
      context: ./opensubtitles-scraper
      dockerfile: Dockerfile
    image: ghcr.io/lavx/opensubtitles-scraper:latest
    container_name: opensubtitles-scraper
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${SCRAPER_DEBUG:-false}
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bazarr-network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://192.168.1.58:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bazarr:
    image: ghcr.io/lavx/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    depends_on:
      opensubtitles-scraper:
        condition: service_healthy
    
    ports:
      - "6767:6767"
    
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/London
      - OPENSUBTITLES_USE_WEB_SCRAPER=true
      - OPENSUBTITLES_SCRAPER_URL=http://opensubtitles-scraper:8000
    
    volumes:
      - /volume1/docker/media-server/bazarr:/config
      - /volume2/media/movies:/movies
      - /volume2/media/tv:/tv
    
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6767/_supervisor/status | grep -q '\"running\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    networks:
      - bazarr-network

  subgen:
      container_name: subgen
      tty: true
      image: mccloud/subgen
      environment:
         - "WHISPER_MODEL=medium"
         - "WHISPER_THREADS=4"
         - "PROCADDEDMEDIA=True"
         - "PROCMEDIAONPLAY=False"
         - "NAMESUBLANG=ai"
         - "SKIPIFINTERNALSUBLANG=eng"
         - "WEBHOOKPORT=9000"
         - "CONCURRENT_TRANSCRIPTIONS=2"
         - "WORD_LEVEL_HIGHLIGHT=False"
         - "DEBUG=True"
         - "USE_PATH_MAPPING=False"
         - "TRANSCRIBE_DEVICE=cpu"
         - "CLEAR_VRAM_ON_COMPLETE=True"
         - "MODEL_PATH=./models"
         - "UPDATE=False"
         - "APPEND=False"
         - "USE_MODEL_PROMPT=False"
         - "CUSTOM_MODEL_PROMPT="
         - "LRC_FOR_AUDIO_FILES=True"
         - "CUSTOM_REGROUP=cm_sl=84_sl=42++++++1"
      volumes:
         - "/volume2/media/tv:/tv"
         - "/volume2/media/movies:/movies"
         - "/volume1/docker/media-server/bazarr/subgen/models:/subgen/models"
      ports:
         - "9000:9000"